// Syntax-only example. Run from the repository root.
options {
    directory ".";
    listen-on { 127.0.0.1; };
    recursion no;
    allow-query { localhost; };
};
zone "example.test" IN {
    type master;
    file "examples/dns/example.test.zone";
    allow-update { none; };
};
zone "2.0.192.in-addr.arpa" IN {
    type master;
    file "examples/dns/192.0.2.rev";
    allow-update { none; };
};
